<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Live microphone</title>
<style>
  :root {
    --primary: #6c5ce7;
    --text: #31333f;
    --muted: rgba(49, 51, 63, 0.6);
    --bg: #ffffff;
    --panel: #f0f2f6;
    --danger: #e5484d;
    --font: "Source Sans Pro", "Source Sans 3", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 2px; font-family: var(--font); color: var(--text); background: transparent; }
  .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 600; font-size: 1rem; border: none; border-radius: 8px;
    padding: 10px 18px; cursor: pointer; color: #fff; background: var(--primary);
    display: inline-flex; align-items: center; gap: 8px;
  }
  button.recording { background: var(--danger); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
  button.recording .dot { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.25; } }
  .status { color: var(--muted); font-size: 0.95rem; }
  .status.error { color: var(--danger); }
  .timer { font-variant-numeric: tabular-nums; color: var(--muted); margin-left: auto; }
  .meter { height: 6px; border-radius: 3px; background: var(--panel); margin: 12px 0; overflow: hidden; }
  .meter > div { height: 100%; width: 0; background: var(--primary); transition: width 80ms linear; }
  .transcript {
    min-height: 110px; padding: 14px 16px; border-radius: 10px; background: var(--panel);
    font-size: 1.2rem; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word;
  }
  .interim { opacity: 0.55; font-style: italic; }
  .placeholder { color: var(--muted); font-size: 1rem; }
</style>
</head>
<body>
  <div class="controls">
    <button id="toggle" disabled><span class="dot"></span><span id="label">Start recording</span></button>
    <span id="status" class="status">Click start and speak.</span>
    <span id="timer" class="timer"></span>
  </div>
  <div class="meter"><div id="level"></div></div>
  <div class="transcript" id="transcript">
    <span id="final"></span><span id="interim" class="interim"></span><span id="placeholder" class="placeholder">Your words will appear here as you speak...</span>
  </div>

<script>
"use strict";

// ---- Minimal Streamlit component protocol (no build step needed) -------------------------
const Streamlit = {
  send(type, data) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data), "*"); },
  ready() { this.send("streamlit:componentReady", { apiVersion: 1 }); },
  setHeight() { this.send("streamlit:setFrameHeight", { height: document.body.scrollHeight + 4 }); },
  setValue(value) { this.send("streamlit:setComponentValue", { value, dataType: "json" }); },
};

// ---- AudioWorklet: mic float32 @ device rate -> 16 kHz PCM16, posted every 100 ms ---------
const WORKLET_SOURCE = `
class Pcm16Downsampler extends AudioWorkletProcessor {
  constructor() {
    super();
    this.ratio = sampleRate / 16000;
    this.pos = 0;
    this.chunk = new Int16Array(1600);
    this.filled = 0;
    this.peak = 0;
  }
  process(inputs) {
    const input = inputs[0] && inputs[0][0];
    if (!input) return true;
    for (; this.pos < input.length; this.pos += this.ratio) {
      const start = Math.floor(this.pos);
      const end = Math.min(input.length, Math.max(start + 1, Math.floor(this.pos + this.ratio)));
      let sum = 0;
      for (let i = start; i < end; i++) sum += input[i];
      const s = Math.max(-1, Math.min(1, sum / (end - start)));
      this.peak = Math.max(this.peak, Math.abs(s));
      this.chunk[this.filled++] = s < 0 ? s * 0x8000 : s * 0x7fff;
      if (this.filled === this.chunk.length) {
        this.port.postMessage({ pcm: this.chunk.buffer.slice(0), peak: this.peak });
        this.filled = 0;
        this.peak = 0;
      }
    }
    this.pos -= input.length;
    return true;
  }
}
registerProcessor("pcm16-downsampler", Pcm16Downsampler);
`;

const $ = (id) => document.getElementById(id);
const ui = { toggle: $("toggle"), label: $("label"), status: $("status"), timer: $("timer"),
             level: $("level"), final: $("final"), interim: $("interim"), placeholder: $("placeholder") };

const DRAIN_QUIET_MS = 1500;
const DRAIN_MAX_MS = 8000;

let args = {};
let usedToken = null;
let session = null; // active session state

function setStatus(text, isError = false) {
  ui.status.textContent = text;
  ui.status.classList.toggle("error", isError);
}

function renderTranscript() {
  const finals = session ? session.finals.join(" ") : ui.final.textContent;
  const interim = session ? session.interim : "";
  ui.final.textContent = finals;
  ui.interim.textContent = interim ? (finals ? " " : "") + interim : "";
  ui.placeholder.style.display = finals || interim ? "none" : "";
  Streamlit.setHeight();
}

function refreshButton() {
  const recording = !!(session && session.recording);
  const busy = !!(session && !session.recording);
  const tokenReady = args.token && args.token !== usedToken;
  ui.toggle.classList.toggle("recording", recording);
  ui.label.textContent = recording ? "Stop recording" : tokenReady || busy ? "Start recording" : "Preparing...";
  ui.toggle.disabled = busy || (!recording && !tokenReady);
}

function formatTime(seconds) {
  const s = Math.floor(seconds);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function toBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  let binary = "";
  for (let i = 0; i < bytes.length; i += 0x8000) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(binary);
}

function newId() {
  return (crypto.randomUUID && crypto.randomUUID()) || `${Date.now()}-${Math.random().toString(16).slice(2)}`;
}

// ---- Session lifecycle ------------------------------------------------------------------------
async function start() {
  const token = args.token;
  if (!token || token === usedToken || session) return;
  usedToken = token;
  session = { id: newId(), finals: [], interim: "", seconds: 0, recording: true, finished: false,
              ready: false, pending: [], lastMessageAt: 0, ws: null, stream: null, ctx: null, timerId: null };
  renderTranscript();
  refreshButton();

  try {
    setStatus("Requesting microphone access...");
    session.stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
  } catch (err) {
    return finish(`Microphone access was denied or unavailable (${err.name || err}).`);
  }
  // Capture immediately and buffer until Gemini is ready, so the first words are not lost.
  if (!(await startAudio())) return;

  setStatus("Connecting to Gemini Live...");
  Streamlit.setValue({ event: "started", id: session.id });
  const ws = new WebSocket(`${args.wsUrl}?access_token=${encodeURIComponent(token)}`);
  ws.binaryType = "arraybuffer";
  session.ws = ws;
  ws.onopen = () => ws.send(JSON.stringify({
    setup: {
      model: `models/${args.model}`,
      generationConfig: { responseModalities: ["TEXT"] },
      inputAudioTranscription: { languageCodes: args.languageCodes || [] },
    },
  }));
  ws.onmessage = (event) => onServerMessage(event.data);
  ws.onerror = () => {};
  ws.onclose = (event) => {
    if (session && !session.finished && session.recording) {
      finish(`Connection to Gemini closed unexpectedly (code ${event.code}${event.reason ? ": " + event.reason : ""}).`);
    }
  };
}

function onServerMessage(data) {
  if (!session) return;
  let message;
  try {
    message = JSON.parse(typeof data === "string" ? data : new TextDecoder().decode(data));
  } catch (_) { return; }

  session.lastMessageAt = Date.now();
  if (message.setupComplete) return onReady();
  if (message.goAway && session.recording) return stop("Session time limit reached.");

  const content = message.serverContent;
  if (!content) return;
  if (content.interimInputTranscription && content.interimInputTranscription.text) {
    session.interim = content.interimInputTranscription.text;
  }
  if (content.inputTranscription && content.inputTranscription.text) {
    session.finals.push(content.inputTranscription.text.trim());
    session.interim = "";
  }
  renderTranscript();
}

function sendAudio(base64) {
  session.ws.send(JSON.stringify({ realtimeInput: { audio: { data: base64, mimeType: "audio/pcm;rate=16000" } } }));
}

function onReady() {
  if (!session || !session.recording) return;
  session.ready = true;
  session.pending.forEach(sendAudio);
  session.pending = [];
  setStatus("Listening... speak now");
}

async function startAudio() {
  if (!session || !session.recording) return false;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    session.ctx = ctx;
    const moduleUrl = URL.createObjectURL(new Blob([WORKLET_SOURCE], { type: "application/javascript" }));
    await ctx.audioWorklet.addModule(moduleUrl);
    URL.revokeObjectURL(moduleUrl);

    const source = ctx.createMediaStreamSource(session.stream);
    const worklet = new AudioWorkletNode(ctx, "pcm16-downsampler");
    const mute = ctx.createGain();
    mute.gain.value = 0;
    source.connect(worklet).connect(mute).connect(ctx.destination); // keeps the graph pulling audio

    worklet.port.onmessage = ({ data }) => {
      if (!session || !session.recording) return;
      const base64 = toBase64(data.pcm);
      if (session.ready && session.ws.readyState === WebSocket.OPEN) sendAudio(base64);
      else session.pending.push(base64);
      session.seconds += 0.1;
      ui.level.style.width = `${Math.min(100, data.peak * 140)}%`;
    };
  } catch (err) {
    finish(`Could not start audio processing (${err.message || err}).`);
    return false;
  }

  session.timerId = setInterval(() => {
    if (!session) return;
    ui.timer.textContent = formatTime(session.seconds);
    if (session.seconds >= (args.maxSeconds || 570)) stop("Maximum session length reached.");
  }, 250);
  return true;
}

function releaseAudio() {
  if (!session) return;
  clearInterval(session.timerId);
  if (session.stream) session.stream.getTracks().forEach((t) => t.stop());
  if (session.ctx) session.ctx.close().catch(() => {});
  ui.level.style.width = "0";
}

function stop(note) {
  if (!session || !session.recording) return;
  session.recording = false;
  session.note = note || "";
  releaseAudio();
  refreshButton();
  setStatus("Finalising transcript...");
  const ws = session.ws;
  if (!ws || ws.readyState !== WebSocket.OPEN || !session.ready) return finish();

  ws.send(JSON.stringify({ realtimeInput: { audioStreamEnd: true } }));
  const drainStarted = Date.now();
  const waitForDrain = setInterval(() => {
    const quietFor = Date.now() - Math.max(session.lastMessageAt, drainStarted);
    if ((quietFor >= DRAIN_QUIET_MS && !session.interim) || Date.now() - drainStarted >= DRAIN_MAX_MS) {
      clearInterval(waitForDrain);
      finish();
    }
  }, 100);
}

function finish(error) {
  if (!session || session.finished) return;
  session.finished = true;
  session.recording = false;
  releaseAudio();
  if (session.interim) { session.finals.push(session.interim.trim()); session.interim = ""; }
  if (session.ws && session.ws.readyState <= WebSocket.OPEN) session.ws.close();

  const text = session.finals.filter(Boolean).join(" ");
  renderTranscript();
  Streamlit.setValue({ event: "finished", id: session.id, text,
                       duration: Math.round(session.seconds * 10) / 10, error: error || null });
  if (error) setStatus(error, true);
  else setStatus(text ? `Done${session.note ? " - " + session.note : ""}. Review and save below.` : "No speech detected.");
  session = null;
  refreshButton();
}

// ---- Wiring -------------------------------------------------------------------------------------
ui.toggle.addEventListener("click", () => (session && session.recording ? stop() : start()));

function applyTheme(theme) {
  if (!theme) return;
  const root = document.documentElement.style;
  if (theme.primaryColor) root.setProperty("--primary", theme.primaryColor);
  if (theme.textColor) {
    root.setProperty("--text", theme.textColor);
    root.setProperty("--muted", theme.textColor + "99");
  }
  if (theme.secondaryBackgroundColor) root.setProperty("--panel", theme.secondaryBackgroundColor);
  if (theme.font) root.setProperty("--font", theme.font);
}

window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "streamlit:render") return;
  args = event.data.args || {};
  applyTheme(event.data.theme);
  refreshButton();
  Streamlit.setHeight();
});

if (!window.isSecureContext || !navigator.mediaDevices) {
  setStatus("Microphone needs HTTPS (or localhost).", true);
}
new ResizeObserver(() => Streamlit.setHeight()).observe(document.body);
Streamlit.ready();
</script>
</body>
</html>
